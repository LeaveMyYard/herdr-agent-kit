name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are superseded; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  doc:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo doc --locked --no-deps --no-default-features

  # COMMON.md "Code structure": <= 300 non-test lines per src file, no inline
  # test modules; exceptions only in .github/structure-allowlist.txt.
  structure:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/structure-check.py --self-test
      - run: python3 .github/scripts/structure-check.py

  # The packaged crate (what crates.io and docs.rs would build) compiles with
  # every feature: it holds every file the code embeds.
  package:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - run: bash .github/scripts/package-check.sh

  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: test (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - { name: none, flags: "--no-default-features" }
          - { name: test-support, flags: "--no-default-features --features test-support" }
          - { name: internal, flags: "--no-default-features --features internal" }
          - { name: tui, flags: "--no-default-features --features tui" }
          - { name: remote, flags: "--no-default-features --features remote" }
          - { name: sqlite, flags: "--no-default-features --features sqlite" }
          - { name: all, flags: "--all-features" }
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features.name }}
      - name: clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features.flags }} -- -D warnings
      - name: test
        run: cargo test --locked ${{ matrix.features.flags }}

  # A compile check for the plugins' four targets. The kit is a library, so
  # this builds an rlib: it proves cfg-compilation and, once C dependencies
  # land (rusqlite `bundled`), that their C code builds for the target. It is
  # not a release build; the kit ships source only. Each target builds on a
  # runner of its own architecture, so no cross C compiler is needed.
  # aarch64-apple-darwin is also the native target of the macOS `test` rows;
  # it stays here so the target list matches the plugins' release list.
  targets:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Install the pinned toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --all-features --target ${{ matrix.target }}

  # Kit PRs also run both plugins' Rust suites against this checkout of the kit,
  # so a change that breaks a plugin shows up before it is tagged. A plugin
  # whose default branch has no Cargo workspace yet is skipped with a notice.
  plugin-suites:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: plugin suite (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [herdr-panorama, herdr-inbox]
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: LeaveMyYard/${{ matrix.plugin }}
          path: plugin
      - name: Test the plugin against this kit
        working-directory: plugin
        env:
          PATCH: 'patch."https://github.com/LeaveMyYard/herdr-agent-kit".herdr-agent-kit.path="../kit"'
        run: bash ../kit/.github/scripts/plugin-suite.sh "${{ matrix.plugin }}"
