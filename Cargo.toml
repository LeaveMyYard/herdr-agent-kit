[package]
name = "herdr-agent-kit"
version = "0.0.0"
edition = "2024"
# MSRV. Kept equal to the channel in rust-toolchain.toml, so CI builds at the MSRV.
rust-version = "1.96"
description = "Shared library for the herdr plugins herdr-panorama and herdr-inbox"
license = "MIT"
repository = "https://github.com/LeaveMyYard/herdr-agent-kit"
readme = "README.md"
# Consumed as a git dependency pinned by tag, never from crates.io (yet).
publish = false

[features]
default = []
# `FakeHerdr`: a scripted herdr socket server for tests (`herdr_api::fake`).
fake = []
# Terminal toolkit shared by the two TUIs (`tui_kit`).
tui = []
# Remote machines: machine list, ssh options, ControlPath scheme (`remote_machines`).
remote = []
# Read-only reader of the inbox's 0.1 `questions` columns (`inbox_contract::sqlite`).
sqlite = []

[dependencies]
# herdr's socket protocol is newline-delimited JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The async client (`herdr_api::Herdr`, the event stream, the async CLI path).
# The binaries run a `current_thread` runtime (plan section 2.5); no `rt-multi-thread`.
tokio = { version = "1", features = ["net", "io-util", "time", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "process"] }

[[test]]
name = "herdr_api"
required-features = ["fake"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
