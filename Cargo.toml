[package]
name = "herdr-agent-kit"
version = "0.1.3"
edition = "2024"
# MSRV. Kept equal to the channel in rust-toolchain.toml, so CI builds at the MSRV.
rust-version = "1.96"
description = "Building blocks for tools around coding agents in herdr: the herdr API client, agent sessions, agent processes and the plugin environment"
license = "MIT"
repository = "https://github.com/LeaveMyYard/herdr-agent-kit"
readme = "README.md"
keywords = ["herdr", "claude-code", "agents", "terminal"]
categories = ["development-tools"]
# The package is the library and the herdr recordings `FakeHerdr` embeds
# (`test-support`). The other fixtures, the tests that read them and the
# replay tool stay in the repo. CI builds the packaged crate with every
# feature (the `package` job).
include = [
  "/src/**",
  "/fixtures/herdr/*.jsonl",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
]
# Consumed as a git dependency pinned by tag, never from crates.io (yet).
publish = false

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Test fakes: `FakeHerdr`, a scripted herdr socket server (`herdr_api::fake`),
# and scripted process tables and liveness (`agent_procs::fake`).
test-support = []
# Plugin-only parts, not public API and outside semver (`internal`):
# the inbox's published formats (`internal::inbox_contract`) and the plugins'
# state layouts (`internal::plugin_paths`).
internal = ["dep:sha1_smol"]
# Read-only reader of the inbox's 0.1 `questions` columns
# (`internal::inbox_contract::sqlite`); plugin-only, so it turns on `internal`.
sqlite = ["internal", "dep:rusqlite"]

[dependencies]
indexmap = "2"
libc = "0.2.191"
memchr = "2"
regex = "1"
# herdr's socket protocol is newline-delimited JSON (`herdr_api`).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# `short_sha1`, the plugins' per-server state key (`internal::plugin_paths`).
sha1_smol = { version = "1.0.1", optional = true }
# The async herdr client (`herdr_api::Herdr`, its event stream and async CLI
# path). The binaries run a `current_thread` runtime (plan section 2.5), so no
# `rt-multi-thread` here.
tokio = { version = "1", features = ["net", "io-util", "time", "process"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
# The event parser under `toml`, for the TOML 1.0 check (`plugin_env::toml10`).
toml_parser = { version = "1.1.5", default-features = false, features = ["std"] }
# `bundled`: SQLite is compiled in, so there is no system sqlite dependency (plan §4).
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
# Reads the JSON goldens in fixtures/.
serde_json = "1"
tempfile = "3.27.0"
# `#[tokio::test]` for the async herdr client.
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "process"] }

[[test]]
name = "herdr_api"
required-features = ["test-support"]

[[test]]
name = "agent_session_claude_fold"
required-features = ["test-support"]

[[test]]
name = "bridge_rules_is_claude"
required-features = ["test-support"]

[[test]]
name = "inbox_nested_claude"
required-features = ["test-support"]

[[test]]
name = "plugin_env_flock"
required-features = ["internal"]

[[test]]
name = "inbox_contract_goldens"
required-features = ["internal"]

# The goldens read `Session::qids`, which is plugin-only (`internal`).
[[test]]
name = "panorama_model_goldens"
required-features = ["internal"]
